# Installed to /etc/overlayroot.local.conf by bootstrap-controller.sh, as its
# very last step. Takes effect at the next boot.
#
# Read-only system disk: the real disk is mounted read-only underneath, and
# everything written while the Controller runs goes to RAM (tmpfs) and is
# gone at power-off. The isolator cuts power with no warning (docs/HARDWARE.md
# "Sudden power loss / ignition-off"); with nothing ever written to the disk
# during a shift, a cut can't leave it half-written. Nothing the Controller
# writes at runtime needs to survive (owner, 2026-09-28): its schedule copy is
# diagnostic only and logs are kept in RAM (coachmate-journald.conf).
#
# recurse=0: only / is overlaid (there is one partition anyway).
#
# To update: update-controller.sh (writable for the update only).
# To switch off for good: sudo overlayroot-chroot rm /etc/overlayroot.local.conf, then reboot.
overlayroot="tmpfs:recurse=0"
