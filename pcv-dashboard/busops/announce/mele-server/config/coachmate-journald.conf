# Installed to /etc/systemd/journald.conf.d/coachmate-volatile.conf by
# bootstrap-controller.sh.
#
# Logs are kept in RAM only (owner, 2026-09-28): the system disk is
# read-only (overlayroot.conf), and there is no writable partition. Logs from
# before a power cut are lost; read them with `journalctl` while the box is
# still running. Capped so a noisy day can't fill RAM.
[Journal]
Storage=volatile
RuntimeMaxUse=64M
