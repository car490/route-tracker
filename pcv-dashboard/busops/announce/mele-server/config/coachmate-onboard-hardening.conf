# Installed to /etc/systemd/system/coachmate-onboard.service.d/hardening.conf
# by bootstrap-controller.sh. A drop-in, so it reaches a coachmate-onboard unit
# installed before this change without rewriting it (that unit holds the
# push token and any hand-added TLS lines, DEPLOY.md §6). Same settings as
# config/coachmate-onboard.service, for a fresh install.
[Service]
Restart=always
RestartSec=3
RuntimeDirectory=coachmate
Environment=SCHEDULE_CACHE_PATH=/run/coachmate/schedule-cache.json
