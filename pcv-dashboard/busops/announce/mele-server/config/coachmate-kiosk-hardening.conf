# Installed to /etc/systemd/system/coachmate-kiosk.service.d/hardening.conf by
# bootstrap-controller.sh. A drop-in, because the kiosk unit is installed by
# hand with its URL filled in (DEPLOY.md §5 Option B) and must not be
# rewritten. Harmless on a Controller with no kiosk display.
[Service]
Restart=always
RestartSec=3
