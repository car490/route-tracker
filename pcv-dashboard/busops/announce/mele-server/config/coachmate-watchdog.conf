# Installed to /etc/systemd/system.conf.d/coachmate-watchdog.conf by
# bootstrap-controller.sh.
#
# Hands the board's hardware watchdog to systemd: if the whole box freezes
# (kernel or systemd itself stops responding), the watchdog chip restarts it
# after 30 s instead of it sitting frozen until someone pulls the power.
# RebootWatchdogSec also forces a stuck shutdown/reboot through.
# Needs the chipset's watchdog (Intel TCO, iTCO_wdt, on the N150) — confirm
# on the bench with `wdctl` (docs/TESTING.md §19 part A).
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=2min
