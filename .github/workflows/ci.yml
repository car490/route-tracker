name: CI

# Pushes run CI only for the two branches that deploy; every other branch runs
# through its pull request. Running on both for every branch ran each PR commit
# twice (tests/ciDeploy.test.js, "CI triggers").
on:
  push:
    branches: [develop, master]
  pull_request:

# Least privilege for the GITHUB_TOKEN: nothing in this workflow writes to the repo.
permissions:
  contents: read

jobs:
  pwa-test:
    name: Driver PWA — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pcv-dashboard/busops/package-lock.json
      - run: npm ci
        working-directory: pcv-dashboard/busops
      - run: npm test
        working-directory: pcv-dashboard/busops
      - run: npm run test:vitest
        working-directory: pcv-dashboard/busops
      # Announcement voice (Ben) shared logic: levelling, render rules, ElevenLabs request, secret scan;
      # Controller clip export; dev/production database parity comparison (scripts/db-drift).
      # Plain node:test, no dependencies; see docs/ANNOUNCE-VOICE-PLAN.md.
      - run: node --test supabase/functions/_shared/announce-voice/*.test.mjs scripts/controller-clips/*.test.mjs scripts/db-drift/*.test.mjs

  dashboard-lint:
    name: Dashboard — lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pcv-dashboard/package-lock.json
      - run: npm ci
        working-directory: pcv-dashboard
      - run: npm run lint
        working-directory: pcv-dashboard

  dashboard-build:
    name: Dashboard — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pcv-dashboard/package-lock.json
      - run: npm ci
        working-directory: pcv-dashboard
      - run: npm run build
        working-directory: pcv-dashboard

  # Supply-chain gate (Step 3 of the security hardening plan). Blocks a PR that adds a
  # HIGH/CRITICAL dependency vulnerability or commits a secret. Moderate advisories are
  # tracked in docs/SECURITY-HARDENING.md rather than blocking, until the breaking
  # react-router / vitest majors are taken.
  supply-chain:
    name: Security — dependency audit + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: npm audit (dashboard, high+)
        run: npm audit --package-lock-only --audit-level=high
        working-directory: pcv-dashboard
      - name: npm audit (busops, high+)
        run: npm audit --package-lock-only --audit-level=high
        working-directory: pcv-dashboard/busops
      - name: npm audit (Bus Controller mele-server, high+)
        run: npm audit --package-lock-only --audit-level=high
        working-directory: pcv-dashboard/busops/announce/mele-server
      - name: Trivy — vulnerabilities and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: node_modules,.git,dist
          exit-code: '1'

  deploy-driver-pwa-dev:
    name: Driver PWA — deploy to driver-dev.pcvtechnologies.co.uk (dev Supabase)
    needs: [pwa-test, dashboard-lint, dashboard-build, supply-chain]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # One deploy to this site at a time, never cancelled mid-deploy. Together
    # with the head check below, an older commit's run can't overwrite a
    # newer one (PRs #100/#101 did on 2026-09-27; tests/ciDeploy.test.js).
    concurrency:
      group: deploy-driver-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pcv-dashboard/busops/package-lock.json
      # Skip when develop has moved on: the newer commit's run deploys it.
      - name: Check this commit is still the head of develop
        id: head
        run: |
          head=$(git ls-remote --exit-code origin refs/heads/develop | cut -f1)
          # A failed lookup must fail the job, not look like "moved on".
          [ -n "$head" ] || { echo "::error::Could not read the head of develop."; exit 1; }
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deploying $GITHUB_SHA: develop is now at $head, whose run deploys it."
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
        if: steps.head.outputs.latest == 'true'
        working-directory: pcv-dashboard/busops
      - run: npx wrangler deploy --env dev
        if: steps.head.outputs.latest == 'true'
        working-directory: pcv-dashboard/busops
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b3fc3cb9a7bc2946482799dfa42c2c90

  deploy-driver-pwa-production:
    name: Driver PWA — deploy to driver.pcvtechnologies.co.uk (production Supabase)
    needs: [pwa-test, dashboard-lint, dashboard-build, supply-chain]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # One deploy to this site at a time, never cancelled mid-deploy. Together
    # with the head check below, an older commit's run can't overwrite a
    # newer one (PRs #100/#101 did on 2026-09-27; tests/ciDeploy.test.js).
    concurrency:
      group: deploy-driver-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pcv-dashboard/busops/package-lock.json
      # Skip when master has moved on: the newer commit's run deploys it.
      - name: Check this commit is still the head of master
        id: head
        run: |
          head=$(git ls-remote --exit-code origin refs/heads/master | cut -f1)
          # A failed lookup must fail the job, not look like "moved on".
          [ -n "$head" ] || { echo "::error::Could not read the head of master."; exit 1; }
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deploying $GITHUB_SHA: master is now at $head, whose run deploys it."
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
        if: steps.head.outputs.latest == 'true'
        working-directory: pcv-dashboard/busops
      - run: npx wrangler deploy
        if: steps.head.outputs.latest == 'true'
        working-directory: pcv-dashboard/busops
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b3fc3cb9a7bc2946482799dfa42c2c90
